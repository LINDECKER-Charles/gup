version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
        update-types: [major, minor, patch]
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
        update-types: [major, minor, patch]
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: [major, minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [patch]
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [ci, security]
