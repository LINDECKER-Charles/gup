name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # gup shells out to a different package manager on every platform and
        # builds OS-specific paths, so a single-OS matrix cannot catch a
        # regression on the other two. Windows stays the primary target;
        # macOS and Linux are first-class since the Homebrew/apt/dnf
        # delegation landed.
        os: [windows-latest, macos-latest, ubuntu-latest]
        # Tracks `engines.node` (>=24.11.0), so only the 24 line is tested:
        # 24 is Active LTS until 2028-04. Node 22 was dropped when the floor
        # moved — testing below the declared floor proves nothing the floor
        # allows. Node 26 becomes LTS on 2026-10-28 and is a candidate to add
        # then, which would restore the two-line shape this matrix used to have.
        node: ["24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # CONTRIBUTING lists lint as part of the PR gate, but no workflow ran it
      # until now — an eslint bump could add violations that nothing surfaced.
      # Restricted to one leg: eslint output does not vary by OS or Node line,
      # so running it six times would only slow the matrix down.
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run lint

      - name: Lint (security ruleset)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run lint:security

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:run
