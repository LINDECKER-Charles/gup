name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # gup shells out to a different package manager on every platform and
        # builds OS-specific paths, so a single-OS matrix cannot catch a
        # regression on the other two. Windows stays the primary target;
        # macOS and Linux are first-class since the Homebrew/apt/dnf
        # delegation landed.
        os: [windows-latest, macos-latest, ubuntu-latest]
        # Tracks `engines.node` (>=26.9.0), so only the 26 line is tested. The
        # floor is 26.9 because the interactive UI is OpenTUI, whose native
        # renderer loads through `node:ffi` — on by default from 26.9 only.
        # Node 24 was dropped with that move: testing below the declared floor
        # proves nothing the floor allows.
        node: ["26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # CONTRIBUTING lists lint as part of the PR gate, but no workflow ran it
      # until now — an eslint bump could add violations that nothing surfaced.
      # Restricted to one leg: eslint output does not vary by OS or Node line,
      # so running it six times would only slow the matrix down.
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == '26'
        run: npm run lint

      - name: Lint (security ruleset)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '26'
        run: npm run lint:security

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:run
