name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly cron so newly disclosed advisories surface even without a push.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-lint:
    name: security tests + eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: ESLint (security ruleset)
        run: npm run lint:security
      - name: Vitest (security suite)
        run: npm run test:security

  dependency-audit:
    name: npm audit (audit-ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run audit:deps:ci

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v5
      - run: semgrep ci --config=.semgrep.yml --config=p/typescript --config=p/nodejs --error
        env:
          # Public-OSS mode (no SEMGREP_APP_TOKEN required).
          SEMGREP_RULES: ""

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action is still pinned to Node 20 (no v3 published yet). Opt into
    # the GitHub-runner Node 24 shim so we don't trip the deprecation warning
    # ahead of the June 2026 cutover. Drop this once gitleaks-action ships v3.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
