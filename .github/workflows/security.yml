name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly cron so newly disclosed advisories surface even without a push.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-lint:
    name: security tests + eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: ESLint (security ruleset)
        run: npm run lint:security
      - name: Vitest (security suite)
        run: npm run test:security

  dependency-audit:
    name: npm audit (audit-ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run audit:deps:ci

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      # returntocorp/* is deprecated; semgrep/semgrep is the current image.
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7
      # `semgrep ci` assumes the Semgrep AppSec Platform (baseline diff, app
      # token, findings upload). Without those it returns 2. `semgrep scan`
      # is the local-OSS entry point — same rules, no platform dependency.
      - run: semgrep scan --config=.semgrep.yml --config=p/typescript --config=p/nodejs --error

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # We invoke the gitleaks binary directly instead of gitleaks-action@v2:
    # the latter requires a paid license for private repositories (the
    # licensing call fails with "repository not found"). The binary itself is
    # MIT-licensed and free for any repo.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan history
        run: gitleaks detect --config=.gitleaks.toml --redact --verbose --exit-code 1
