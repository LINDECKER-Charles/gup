name: pages

# Deploys the static landing in index/ to GitHub Pages.
# The page is the canonical entry point referenced by README, package.json
# (homepage), the sitemap, and every JSON-LD block in index.html — so it
# MUST stay reachable at https://lindecker-charles.github.io/gup/ for SEO
# (canonical URL, OG image, sitemap discovery, AI engines' llms.txt fetch).

on:
  push:
    branches: [main]
    paths:
      - "index/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Force GitHub Pages official actions (configure-pages, upload-pages-artifact,
# deploy-pages) to run on Node.js 24. Upstream still ships them with a Node 20
# runtime, deprecated by GitHub for removal on 2026-09-16. The env var is
# GitHub's documented opt-in path until upstream cuts new majors.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: index
    steps:
      - uses: actions/checkout@v7
        with:
          # The build derives `lastmod` / `dateModified` from the last commit
          # touching index/ (scripts/last-change.mjs). Two commits of history is
          # enough for `git log -1 -- .` to answer, and it falls back to HEAD's
          # own date when the trigger was a workflow_dispatch on a commit that
          # did not touch index/.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: index/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + prerender)
        # Four steps behind one script:
        #   1. sync-facts   — regenerates src/data/facts.js from the repo root
        #                     package.json and src/core/registry.ts, so the
        #                     version and the provider count cannot drift.
        #   2. vite build   — client bundle, tree-shaken, minified, code-split
        #                     (react in its own chunk via manualChunks). All of
        #                     static/ is copied verbatim, preserving the already
        #                     indexed /gup/public/*, /gup/robots.txt,
        #                     /gup/sitemap.xml and /gup/llms.txt URLs.
        #   3. prerender    — renders the React tree into dist/index.html, so
        #                     the deployed HTML carries the real content for
        #                     crawlers and AI fetchers that do not run JS.
        #   4. stamp-static — writes the facts and the git-derived lastmod into
        #                     the built llms.txt, sitemap.xml, 404.html and
        #                     manifest.
        # Every step fails loudly: a silent prerender failure would ship a blank
        # page to every non-rendering crawler, and that is invisible in a
        # browser.
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./index/dist

  deploy:
    name: deploy to pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
