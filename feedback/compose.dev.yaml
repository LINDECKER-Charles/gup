# Local development: built from source, plain http on 127.0.0.1, mails caught
# by Mailpit. Secrets come from dev.env (see README.md):
#
#   docker compose --env-file dev.env -f compose.yaml -f compose.dev.yaml up -d --build
#
# Back office: http://127.0.0.1:8787/admin — use 127.0.0.1, not localhost: the
# admin forms are checked against FEEDBACK_PUBLIC_URL's exact origin.
# Mailpit: http://127.0.0.1:8025
# Postgres: 127.0.0.1:5439 (FEEDBACK_DEV_DB_PORT in dev.env moves it)

services:
  gup-feedback:
    build: .
    image: gup-feedback:dev
    ports:
      - "127.0.0.1:8787:8080"
    environment:
      FEEDBACK_ENV: development
      FEEDBACK_PUBLIC_URL: http://127.0.0.1:8787
      FEEDBACK_LANDING_URL: http://127.0.0.1:5173/gup/
      # Vite dev server (both spellings) and the landing's preview server.
      FEEDBACK_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5180
      ADMIN_USERNAME: admin
      COOKIE_SECURE: "false"
      SMTP_URL: smtp://gup-feedback-mailpit:1025
      MAIL_FROM: feedback@example.com
      FEEDBACK_NOTIFY_TO: maintainer@example.com
      OUTBOX_POLL_INTERVAL_SECONDS: "5"
    depends_on:
      mailpit:
        condition: service_started

  # Reachable from the host for psql and `npm run seed:demo`; loopback only.
  postgres:
    ports:
      - "127.0.0.1:${FEEDBACK_DEV_DB_PORT:-5439}:5432"

  mailpit:
    image: axllent/mailpit:v1
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      default:
        aliases:
          - gup-feedback-mailpit
